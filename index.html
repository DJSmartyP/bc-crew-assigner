<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111e">
  <title>Interstellar Deployment Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="Interstellar Deployment Planner home">
        <span class="brand-mark">BC</span>
        <span><b>Interstellar</b><small>Deployment Planner</small></span>
      </a>
      <div id="topActions" class="top-actions"></div>
    </header>

    <main id="main" class="main" aria-live="polite">
      <section class="loading-card">
        <span class="scanner"></span>
        <h1>Loading crew planner…</h1>
        <p>Getting the mission ready.</p>
      </section>
    </main>

    <footer class="footer">Interstellar community crew-planning tool</footer>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
